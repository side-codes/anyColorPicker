name: Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo. Without this the default token
# permissions are far wider than anything here needs.
permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The API removal check reads the dumps at the last release tag.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build libraries
        run: ./gradlew :colorpicker:assemble :color:assemble
      - name: Run tests
        run: ./gradlew :colorpicker:allTests :color:allTests
      # GeneratedConstants.kt is written from CSS's definitions by this script; a hand edit, or a
      # script change without a rerun, leaves the two disagreeing with nothing else to notice.
      - name: Check the generated color constants are current
        run: python3 tools/generate_color_constants.py --check
      # Fails when public API drifts from colorpicker/api/. Without this the
      # binary-compatibility plugin is configured but never consulted.
      - name: Check the public API matches the committed dump
        run: ./gradlew apiCheck
      # apiCheck compares against the dump in the working tree, which apiDump rewrites along with
      # the change. This compares against the last release, so a removal cannot ride along.
      - name: Check nothing the last release published was removed
        run: bash scripts/check-api-removals.sh
      # The references under screenshot-tests/src/screenshotTestDebug/reference are only a
      # regression check if something compares against them. These render host-side, so
      # ubuntu-latest needs no emulator.
      - name: Validate the Compose preview goldens
        run: ./gradlew :screenshot-tests:validateDebugScreenshotTest
      # A failure here is a visual difference, which the log reports only as a pixel count.
      # The report holds the reference, the actual and the diff for each preview.
      - name: Upload the screenshot diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-report
          path: screenshot-tests/build/reports/screenshotTest/

      - name: Build sample APK
        run: ./gradlew :sample:androidApp:assembleDebug
      - name: Upload sample APK
        uses: actions/upload-artifact@v7
        with:
          name: sample-apk
          path: sample/androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The API removal check reads the dumps at the last release tag.
          fetch-depth: 0
      # publish.yml runs this on macOS, whose awk, sort and comm are BSD's. Running it here
      # too means a difference shows on a pull request rather than first on a release tag.
      - name: Check nothing the last release published was removed
        run: bash scripts/check-api-removals.sh
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # macos-15 defaults to Xcode 16.4, whose iOS SDK predates UIViewLayoutRegion — a
      # symbol Compose Multiplatform's ui-uikit references. Kotlin/Native static caches
      # link whole modules rather than tree-shaking, so any iOS *test executable* fails to
      # link without a 26.x SDK (the static framework link survives because an archive
      # never resolves external symbols). The image ships several Xcodes; take the newest.
      - name: Select the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build iOS framework
        run: ./gradlew :colorpicker:linkDebugFrameworkIosSimulatorArm64
      - name: Run iOS simulator tests
        run: ./gradlew :colorpicker:iosSimulatorArm64Test :color:iosSimulatorArm64Test
